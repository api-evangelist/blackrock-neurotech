notes: >-
  Blackrock Neurotech publishes no packages to npm, PyPI, Maven Central, NuGet,
  pkg.go.dev, RubyGems, Packagist or crates.io (all probed 2026-08-02, all 404).
  Its first-party client libraries are distributed as source from the
  BlackrockNeurotech GitHub organization and as signed installers/IFU-numbered
  downloads from the support site. Device/instrument APIs (cbSDK, cbMEX, CereStim
  API) ship inside the Central Software Suite download rather than a public
  package registry, so they are recorded here as distribution: download.
