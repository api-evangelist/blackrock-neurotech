description: 'Blackrock Neurotech is a Salt Lake City, Utah based neurotechnology company
  that designs and manufactures implantable brain-computer interface (BCI) systems and
  the research instrumentation around them. Its platform pairs Utah Array microelectrode
  arrays and the next-generation Neuralace interface with the NeuroPort, Cerebus and
  CerePlex Direct neural signal processors, the CereStim stimulation system, and the
  Central software suite for acquisition, visualization and offline spike sorting. The
  company reports more than 19 years of human clinical study, 1,000+ research institutions
  served and 2,000+ published studies using its hardware. Blackrock does not publish a
  public web API: its programmatic surface is a set of device and file-format libraries
  distributed as downloads and GitHub source (cbSDK C++ API, cbMEX MATLAB API, CereStim
  API, brPY/brpylib Python data loader, and the NPMK MATLAB toolkit). Enrichment probing
  on 2026-08-02 found no OpenAPI, AsyncAPI, GraphQL, MCP, agent card, llms.txt or
  /.well-known/ discovery surface on any Blackrock host.'
